title = "Low-beta stratified linear-mode example"
output_dir = "outputs_low_beta"

[equations]
type = "low_beta_stratified"
mode = "nonlinear"

[grid]
Nx = 32
Ny = 32
Nz = 32
Lx = 6.283185307179586
Ly = 6.283185307179586
Lz = 6.283185307179586

[time]
tmax = 0.5
dt_init = 0.001
dt_max = 0.002
cfl_number = 0.4
use_variable_dt = true

[output]
t_out_scal = 0.02
t_out_spec = 0.1
t_out_full = 0.0

[backend]
backend = "numpy"
real_dtype = "float64"
complex_dtype = "complex128"

[runtime]
runtime_check_every = 10
progress_output_every = 100
fail_on_nonfinite = true
project_kpar0 = false
dealias = true
dealias_mode = "two_thirds"

[physics]
vA = 1.0
cs2_over_vA2 = 1.0
N2 = 0.25

[forcing]
use_forcing = false
n_min_force = 1.0
n_max_force = 3.0
alpha_force = 0.0

[forcing.force_amplitudes]
psi = 0.0
omega = 0.0
a = 0.0

[dissipation]
mode = "manual"
n_perp = 3
n_par = 3
nu_par = 0.0
kd_fraction = 0.6
shell_half_width = 0.5
update_every = 10
smooth_factor = 0.2
nu_min = 1e-12
nu_max = 100.0
max_update_factor = 2.0

[dissipation.psi]
nu_perp = 0.0001
nu_par = 0.0
n_perp = 2
n_par = 1

[dissipation.omega]
nu_perp = 0.0001
nu_par = 0.0
n_perp = 2
n_par = 1

[dissipation.a]
nu_perp = 0.0001
nu_par = 0.0
n_perp = 2
n_par = 1

[initial_condition]
type = "low_beta_stratified_mode"

[initial_condition.parameters]
k_indices = [0, 1, 0]
amplitude = 0.02
mode = "unstable_growing"
