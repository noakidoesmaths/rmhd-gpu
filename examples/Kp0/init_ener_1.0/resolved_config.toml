title = "Nokia rho controlled forcing: target amplitude"
output_dir = "Kp0/init_ener_1.0"

[equations]
type = "inhomogeneous_rmhd_rho"
mode = "nonlinear"

[grid]
Nx = 32
Ny = 32
Nz = 32
Lx = 6.283185307179586
Ly = 6.283185307179586
Lz = 6.283185307179586

[time]
tmax = 200.0
dt_init = 0.001
cfl_number = 0.3
use_variable_dt = true

[output]
t_out_scal = 0.02
t_out_spec = 0.5
t_out_full = 0.0

[backend]
backend = "scipy_cpu"
real_dtype = "float64"
complex_dtype = "complex128"

[runtime]
runtime_check_every = 10
progress_output_every = 100
fail_on_nonfinite = true
project_kpar0 = false
dealias = true
dealias_mode = "two_thirds"

[physics]
vA = 1.0
cs2_over_vA2 = 0.1
N2 = 1.0

[forcing]
use_forcing = false
type = "stochastic"
forcing_mode = "field"
n_min_force = 1.0
n_max_force = 3.0
alpha_force = 0.0
epsilon_plus = 0.0
epsilon_minus = 0.0

[forcing.field_energy_injection_rates]
psi = 0.0
omega = 0.0
du_par = 0.0
db_par = 0.0
drho = 0.0

[dissipation]
mode = "auto"
n_perp = 3
n_par = 3
nu_par = 0.0
kd_fraction = 0.8
shell_half_width = 0.5
update_every = 10
smooth_factor = 0.2
nu_min = 1e-08
nu_max = 1.0
max_update_factor = 2.0
shell_energy = "total"

[dissipation.psi]
nu_perp = 0.0
nu_par = 0.0
n_perp = 3
n_par = 3

[dissipation.omega]
nu_perp = 0.0
nu_par = 0.0
n_perp = 3
n_par = 3

[dissipation.du_par]
nu_perp = 0.0
nu_par = 0.0
n_perp = 3
n_par = 3

[dissipation.db_par]
nu_perp = 0.0
nu_par = 0.0
n_perp = 3
n_par = 3

[dissipation.drho]
nu_perp = 0.0
nu_par = 0.0
n_perp = 3
n_par = 3

[initial_condition]
type = "random_spectrum_one_wave"

[initial_condition.parameters]
n_min_perp = 1.0
n_min_prl = 1.0
n_max_perp = 3.0
n_max_prl = 3.0
alpha = 4.67
alpha_prl = 1.67
init_energy = 1.0
seed = 30
initialization_backend = "native"
exclude_kpar0 = false
